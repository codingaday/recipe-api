name: CI
on:
  push:
    branches: [main] # Assuming you switched to main per earlier context
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-lint:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # Updated from v2 to v4
      - name: Login to DockerHub
        uses: docker/login-action@v3 # Updated from v1 to v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # Add to ensure Docker Buildx is available
      - name: Build Docker image
        run: docker-compose build # Build the image to ensure it's available
      - name: Test
        run: docker-compose run --rm app sh -c "python manage.py test"
      - name: Lint
        run: docker-compose run --rm app sh -c "flake8"
